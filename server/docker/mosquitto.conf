# Montado en /mosquitto/config/mosquitto.conf (ver ../../docker-compose.yml).
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

listener 1883

# Los nodos ESP32 actuales (firmware/config.py) se conectan sin usuario ni
# contraseña. Si endurecemos esto más adelante, hay que agregar autenticación
# también en firmware/lib antes de poner allow_anonymous en false.
allow_anonymous true

# Cada ESP32 se conecta como su propio cliente MQTT con client_id = NODE_ID
# (firmware/lib/publisher.py) o DISPOSITIVO-<millis> para el firmware de
# Arduino (firmware/ESP32/*.ino). Con esto, cada conexión/desconexión queda
# en el log con ese id y hora legible; ver server/docker/README.md#logs.
connection_messages true
log_timestamp_format %Y-%m-%d %H:%M:%S
