# Construye la imagen de server/docker/Dockerfile en cada push que toque el
# servidor. Solo en main se publica en GHCR (ghcr.io/aramisjasso/noise-iot-server);
# en las demás ramas y en los PR solo se verifica que compile.
name: docker-server

on:
  push:
    paths:
      - "server/mqtt/**"
      - "server/monitor/**"
      - "server/docker/**"
      - "analysis/features/**"
      - "analysis/labeling/**"
      - "analysis/pytorch_audio/**"
      - "contracts/mqtt/**"
      - ".dockerignore"
      - ".github/workflows/docker-server.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests del suscriptor
        run: |
          pip install -r server/mqtt/requirements.txt
          python -m unittest discover -s server/mqtt/tests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/noise-iot-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
